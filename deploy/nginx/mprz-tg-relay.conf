# /etc/nginx/sites-available/tg-relay — on mprz.ru.
#
# Forwards Bot API calls from the house to Telegram over this machine's own route.
#
# It exists because the mobile carrier the backup uplink runs on cannot reach
# api.telegram.org at all. Without it, every alert raised at the house during a wired outage
# is lost — which is what happened on 2026-07-29: the failover alert never arrived and the
# restore alert, eight minutes later, did. Being told an outage ended and never that it began
# is the worst shape available.
#
# Bound to the tunnel address on port 80, not to a port of its own. Two reasons: the
# tunnel-facing ports already permitted here are 22, 80 and 443 — anything else is dropped
# before nginx sees it — and `listen 10.67.67.1:80` is a more specific match than the
# `listen 80` the eleven public sites share, so it takes precedence for this address only and
# leaves them alone. Nothing else ever connects to this address on this port.
server {
    listen 10.67.67.1:80;
    server_name _;

    # The house, and nothing else — not even the other peer on this tunnel. An open relay to
    # Telegram is a thing other people would like to have.
    allow 10.67.67.3;
    deny all;

    # Off, because the Bot API carries the token in the path. Left on, every alert writes a
    # live credential into a web server's access log on the busiest machine here, where it
    # then survives in rotation and in every backup of it. The useful record of a delivery
    # already exists at the sender; this log would only add a place to leak from.
    access_log off;

    location / {
        proxy_pass https://api.telegram.org;
        proxy_ssl_server_name on;
        proxy_set_header Host api.telegram.org;
        proxy_read_timeout 20s;
    }
}
