# /etc/nginx/sites-available/sms-gate-tunnel — on the house.
#
# Reached only from mprz.ru over wg-burns. TLS is terminated there, so what arrives here is
# plain HTTP inside the tunnel.
#
# Bound to the tunnel address specifically, not to every address. The public block for this
# hostname redirects to https, and a wildcard listener here would have caught the proxied
# request and answered it with a redirect loop.
server {
    listen 10.67.67.3:80;
    server_name sms.deralsem.ru;

    location / {
        proxy_pass http://127.0.0.1:30080;
        proxy_set_header Host $host;

        # Passed through, NOT appended to. `$proxy_add_x_forwarded_for` would add this
        # server's own view of the peer — the far end's tunnel address — and uvicorn reads
        # the last entry, so the caller's address would be replaced by a number that is the
        # same on every request and says nothing. The far end already recorded who called;
        # nothing here improves on it.
        #
        # Trustworthy because the filter on the interface admits only the far end, so this
        # header cannot arrive from anywhere that did not set it from a real peer address.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
