# /etc/nginx/sites-available/gateway.example.com — on edge.example.com, the machine that publishes it.
#
# Additive on purpose: a server block beside the eleven already there, not a rework of the
# entry point they all share. Converting that listener into a stream with SNI inspection —
# which is what passing TLS through to the house would require — would put every other
# service in the estate behind one edit.
server {
    listen 80;
    listen [::]:80;
    server_name gateway.example.com;
    # Kept, and not only for tidiness: the certificate challenge arrives here.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gateway.example.com;

    # A copy of the house's certificate, as a bridge across the cutover, so there was no
    # window in which the hostname answered with the wrong one. Replaced by a certificate
    # issued here once the record pointed here and the challenge could reach it.
    ssl_certificate     /etc/ssl/sms-bridge/fullchain.pem;
    ssl_certificate_key /etc/ssl/sms-bridge/privkey.pem;

    # Stated rather than inherited. SMS bodies are small, and an unstated limit on a public
    # entrance is an invitation.
    client_max_body_size 1m;

    location / {
        proxy_pass http://10.10.10.3:80;
        proxy_set_header Host $host;
        # This is the only place the caller's address is known. Downstream must pass it
        # through untouched rather than append to it — see the house's block.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
